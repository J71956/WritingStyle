[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stylellm"
version = "0.1.0"
description = "Personal Style LLM — local, single-user writing-style analysis (v1: ingest + style profile)"
readme = "personal-style-llm-spec.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "spacy>=3.7",
    "textstat>=0.7",
    "langdetect>=1.0.9",
    "sentence-transformers>=2.7",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    # Experiment analysis: Wilcoxon / binomtest and the paper's figures.
    "scipy>=1.11",
    "matplotlib>=3.8",
]
# Local generation via Hugging Face transformers. torch already arrives
# transitively via sentence-transformers, but it is pinned here so the CUDA
# build is a deliberate choice rather than an incidental one.
hf = [
    "transformers>=4.45",
    "accelerate>=0.30",
    "torch>=2.2",
]
# Optional 4-bit quantization for models that won't fit in VRAM at full width.
quant = [
    "bitsandbytes>=0.43",
]

[project.scripts]
stylellm = "stylellm.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end tests that run on the real Dataset/ corpus",
]

[tool.ruff]
line-length = 100
target-version = "py311"
