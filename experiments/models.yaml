# Model axis for the test campaign (§0 of TEST-AND-PAPER-PLAN.md).
#
# Two ~4-9B instruct models run locally through llama.cpp. The harness starts
# one `llama-server` per model slice and stops it before the next model loads;
# `hf_spec` is llama.cpp's `-hf` form (`<repo>:<quant>`), resolved out of the
# same Hugging Face cache the rest of the pipeline uses.
#
# `revision` should be filled in with the resolved snapshot sha after the
# pre-flight download — the paper's Experimental Setup cites it, and pinning it
# is what makes the campaign reproducible against a moving Hub repo. The
# LlamaCppBackend reads the sha back off the served model path, so a run prints
# the value to record here.
#
# Q4_K_M for both: a 9B model at bf16 needs ~18 GB, which does not fit the 8 GB
# RTX 3070 Laptop this campaign runs on; the same model is ~5.7 GB at Q4_K_M.
# Quantization is a reportable experimental condition, not an implementation
# detail — the paper's Setup section states it.
#
# `gguf_file` is checked against what llama-server actually has loaded, so a
# stale server cannot silently mislabel a slice.
#
# Llama-3.1-8B was dropped from the axis: its Hub repo is gated, and a licence
# gate in the middle of a reproducibility campaign is a dependency on someone
# else's approval queue. Both models below are ungated and already cached. If
# you re-add a gated model, accept the licence and run `hf auth login` first,
# and note that repo *metadata* is readable before approval while the *files*
# still 403 -- the only reliable access check is fetching a real file, not
# calling model_info().
version: 1

models:
  - key: qwen3.5-9b
    model: unsloth/Qwen3.5-9B-GGUF
    hf_spec: unsloth/Qwen3.5-9B-GGUF:Q4_K_M
    gguf_file: Qwen3.5-9B-Q4_K_M.gguf
    revision: null
    # Hybrid-reasoning family: suppress chain-of-thought so max_tokens is
    # spent on the answer. Harmless on templates that ignore the flag.
    enable_thinking: false
    gated: false

  # Gemma has no system role in its chat
  # template, so the backend folds the system instruction into the user turn for
  # this model and records it as `merged_system` -- a prompt-framing difference
  # between models that the paper's Setup section must state, not hide.
  - key: gemma4-e4b
    model: unsloth/gemma-4-E4B-it-GGUF
    hf_spec: unsloth/gemma-4-E4B-it-GGUF:Q4_K_M
    gguf_file: gemma-4-E4B-it-Q4_K_M.gguf
    revision: null
    enable_thinking: null
    gated: false
